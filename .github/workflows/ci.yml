name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go verification
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -tags=webkit2_41
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build embedded frontend assets
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir frontend build
      - name: Install desktop and notebook test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/superscience-python"
          "$RUNNER_TEMP/superscience-python/bin/python" -m pip install -r workers/python/requirements.txt
          "$RUNNER_TEMP/superscience-python/bin/python" -m ipykernel install --prefix "$RUNNER_TEMP/superscience-python" --name python3
          echo "SUPERSCIENCE_PYTHON=$RUNNER_TEMP/superscience-python/bin/python" >> "$GITHUB_ENV"
          echo "JUPYTER_PATH=$RUNNER_TEMP/superscience-python/share/jupyter" >> "$GITHUB_ENV"
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  frontend:
    name: Frontend and browser verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir frontend lint
      - name: Unit tests
        run: pnpm --dir frontend test -- --run
      - name: Production build
        run: pnpm --dir frontend build
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Install Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: pnpm --dir frontend exec playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

  production-contract:
    name: Production contract scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install scan dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Reject production placeholders
        run: ./scripts/check-production-placeholders.sh
