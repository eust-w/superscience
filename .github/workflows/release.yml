name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v2.12.0

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -tags=webkit2_41
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev python3-venv ripgrep
          python3 -m venv "$RUNNER_TEMP/superscience-python"
          "$RUNNER_TEMP/superscience-python/bin/python" -m pip install -r workers/python/requirements.txt
          "$RUNNER_TEMP/superscience-python/bin/python" -m ipykernel install --prefix "$RUNNER_TEMP/superscience-python" --name python3
          echo "SUPERSCIENCE_PYTHON=$RUNNER_TEMP/superscience-python/bin/python" >> "$GITHUB_ENV"
          echo "JUPYTER_PATH=$RUNNER_TEMP/superscience-python/share/jupyter" >> "$GITHUB_ENV"
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be semantic versioned: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: pnpm --dir frontend build
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test -- --run
      - run: pnpm audit
      - run: ./scripts/check-production-placeholders.sh

  cli:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: superscience
          - goos: linux
            goarch: arm64
            binary: superscience
          - goos: darwin
            goarch: amd64
            binary: superscience
          - goos: darwin
            goarch: arm64
            binary: superscience
          - goos: windows
            goarch: amd64
            binary: superscience.exe
          - goos: windows
            goarch: arm64
            binary: superscience.exe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build CLI
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p release-input dist
          CGO_ENABLED=0 GOOS="$TARGET_GOOS" GOARCH="$TARGET_GOARCH" go build -trimpath \
            -ldflags "-s -w -X superscience/internal/buildinfo.Version=${GITHUB_REF_NAME} -X superscience/internal/buildinfo.Commit=${GITHUB_SHA}" \
            -o "release-input/${{ matrix.binary }}" ./cmd/superscience
      - name: Package CLI
        run: |
          go run ./cmd/releasepack \
            --version "$GITHUB_REF_NAME" \
            --goos "${{ matrix.goos }}" \
            --goarch "${{ matrix.goarch }}" \
            --binary "release-input/${{ matrix.binary }}" \
            --output dist
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin/universal
            label: darwin_universal
            tags: ""
          - runner: windows-latest
            platform: windows/amd64
            label: windows_amd64
            tags: ""
          - runner: ubuntu-24.04
            platform: linux/amd64
            label: linux_amd64
            tags: webkit2_41
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - if: runner.os == 'Linux'
        name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: pnpm install --frozen-lockfile
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Wails desktop app
        shell: bash
        run: |
          args=(build -clean -platform "${{ matrix.platform }}")
          if [ -n "${{ matrix.tags }}" ]; then
            args+=(-tags "${{ matrix.tags }}")
          fi
          args+=(-ldflags "-X superscience/internal/buildinfo.Version=${GITHUB_REF_NAME} -X superscience/internal/buildinfo.Commit=${GITHUB_SHA}")
          wails "${args[@]}"
      - if: runner.os == 'macOS'
        name: Package macOS desktop app
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent build/bin/Superscience.app "dist/Superscience_desktop_${VERSION}_darwin_universal.zip"
      - if: runner.os == 'Windows'
        name: Package Windows desktop app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path build/bin/Superscience.exe -DestinationPath "dist/Superscience_desktop_${version}_windows_amd64.zip"
      - if: runner.os == 'Linux'
        name: Package Linux desktop app
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "dist/Superscience_desktop_${VERSION}_linux_amd64.tar.gz" -C build/bin Superscience
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-draft:
    needs: [cli, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Build and verify checksum manifest
        working-directory: release-assets
        run: |
          cat ./*.sha256 | sort > checksums.txt
          rm ./*.sha256
          for asset in Superscience_desktop_*; do
            sha256sum "$asset" >> checksums.txt
          done
          sort -u -o checksums.txt checksums.txt
          sha256sum --check checksums.txt
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if release_is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$release_is_draft" != "true" ]; then
              echo "Refusing to overwrite assets on published release $GITHUB_REF_NAME; only drafts may be updated." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --draft --generate-notes --title "Superscience $GITHUB_REF_NAME"
          fi
